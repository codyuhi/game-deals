<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    /* Light browser chrome -> deep Cedar pigments */
    .pad { stroke: #1f513f; }
    .btn-a { fill: #c7370f; }
    .btn-b { fill: #b8860b; }

    /* Dark browser chrome -> ecru outline, bright pigments */
    @media (prefers-color-scheme: dark) {
      .pad { stroke: #f4f2ed; }
      .btn-a { fill: #e0532b; }
      .btn-b { fill: #e0a92e; }
    }
  </style>
  <!-- Controller body -->
  <path class="pad" d="M 20 17 H 44 C 54.5 17 60.5 25.5 60.5 36 C 60.5 46 55.5 52 49.5 52 C 44 52 41.5 46 36 44 H 28 C 22.5 46 20 52 14.5 52 C 8.5 52 3.5 46 3.5 36 C 3.5 25.5 9.5 17 20 17 Z" stroke-width="4.5" stroke-linejoin="round" />
  <!-- D-pad -->
  <path class="pad" d="M 18 27.5 V 39.5 M 12 33.5 H 24" stroke-width="4.5" stroke-linecap="round" />
  <!-- Face buttons -->
  <circle class="btn-a" cx="45" cy="29.5" r="3.6" />
  <circle class="btn-b" cx="50.5" cy="37" r="3.6" />
</svg>
